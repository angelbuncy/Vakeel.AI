<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vakeel.ai — Universal Legal Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    --cream: #F4EFE4; --cream-dark: #E8DFC9; --cream-mid: #EDE5D0;
    --board: #1E1208; --board-2: #2A1A0A; --board-3: #3A220E;
    --wood: #5C3318; --accent: #922E0E; --accent-2: #C44A1C; --accent-3: #E8693A;
    --gold: #B07B08; --gold-2: #D4A017; --gold-3: #F0C040;
    --green: #1A5C3A; --green-2: #2E8B57; --green-3: #52C47A;
    --text-dark: #140C04; --text-mid: #3D2210; --text-muted: #7A5A36; --text-faint: #B09070;
    --border: #C8B090; --border-dark: rgba(255,255,255,0.08); --border-dark-2: rgba(255,255,255,0.13);
    --sidebar: 240px; --radius: 10px; --radius-lg: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--cream-dark); font-family: 'DM Mono', monospace; color: var(--text-dark); overflow: hidden; }

  .shell { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: var(--cream-dark); background-image: radial-gradient(var(--border) 0.8px, transparent 0.8px); background-size: 22px 22px; }
  .window { margin: 18px auto; width: calc(100% - 36px); max-width: 1280px; height: calc(100vh - 36px); background: var(--cream); border-radius: 16px; border: 1.5px solid var(--border); box-shadow: 0 8px 40px rgba(20,12,4,0.28), 0 2px 8px rgba(20,12,4,0.18); display: flex; flex-direction: column; overflow: hidden; }
  .titlebar { background: var(--cream-mid); border-bottom: 1.5px solid var(--border); padding: 10px 18px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .tl-dots { display: flex; gap: 6px; } .dot { width: 12px; height: 12px; border-radius: 50%; } .dot-r { background: #FF5F57; } .dot-y { background: #FEBC2E; } .dot-g { background: #28C840; }
  .tl-title { flex: 1; text-align: center; font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; }
  .tl-badge { font-size: 10px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; }

  .app-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .sidebar { width: var(--sidebar); background: var(--cream); border-right: 1.5px solid var(--border); display: flex; flex-direction: column; padding: 18px 14px 16px; gap: 20px; flex-shrink: 0; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 9px; font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text-dark); }
  .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--board); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); margin-bottom: 14px; margin-left: -4px; }
  
  .sb-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; }
  .mode-toggle { display: flex; background: var(--cream-dark); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .mode-btn.active { background: var(--board); color: var(--cream); border-radius: 6px; margin: 2px; }

  .nav-list { display: flex; flex-direction: column; gap: 3px; }
  .nav-item { padding: 9px 11px; border-radius: 7px; border: 1px solid transparent; font-size: 11px; color: var(--text-mid); cursor: not-allowed; display: flex; align-items: center; gap: 9px; transition: all 0.14s; background: transparent; opacity: 0.6; }
  .nav-item.active { background: var(--board); color: var(--cream); border-color: var(--board-3); opacity: 1; cursor: default; }
  .nav-item.completed { opacity: 1; cursor: pointer; }
  .nav-item.completed:hover { background: var(--cream-dark); border-color: var(--border); }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .db-btn { background: var(--accent); color: white; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .db-btn:hover { background: var(--accent-2); }

  .api-key-box { background: var(--cream-dark); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .custom-select { width: 100%; background: transparent; border: none; outline: none; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-mid); padding: 10px 11px; cursor: pointer; appearance: none; }
  .select-wrapper { position: relative; }
  .select-wrapper::after { content: "▼"; font-size: 8px; color: var(--text-muted); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }

  .stat-card { background: var(--cream-dark); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
  .stat-label { font-size: 10px; color: var(--text-muted); }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--accent); }
  .sb-footer { margin-top: auto; display: flex; gap: 6px; }
  .sb-btn { flex: 1; padding: 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--cream-dark); font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-mid); cursor: pointer; transition: all 0.12s; }
  .sb-btn:hover { background: var(--cream-mid); }
  .sb-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  .main { flex: 1; background: var(--board); display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }
  .grain { position: absolute; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(rgba(255,255,255,0.028) 1px, transparent 1px); background-size: 16px 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 13px 20px; border-bottom: 1px solid var(--border-dark); flex-shrink: 0; position: relative; z-index: 2; }
  .status-pill { background: rgba(255,255,255,0.07); border: 1px solid var(--border-dark-2); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #E8D5B8; display: flex; align-items: center; gap: 7px; }
  .status-led { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--green-3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .rag-pill { background: var(--green); border-radius: 20px; padding: 5px 13px; font-size: 11px; color: #90E8B8; display: flex; align-items: center; gap: 5px; }

  .scroll-area { flex: 1; overflow-y: auto; padding: 22px 22px 32px; position: relative; z-index: 1; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }
  .sec-eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,239,228,0.3); margin-bottom: 5px; }
  .sec-title { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: #F2E6CC; margin-bottom: 18px; }

  .field-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .field-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,239,228,0.45); margin-bottom: 5px; }
  .field-input, .field-textarea, .field-select { width: 100%; background: rgba(255,255,255,0.055); border: 1px solid var(--border-dark-2); border-radius: 8px; padding: 11px 13px; font-family: 'DM Mono', monospace; font-size: 12px; color: #EEE0C4; outline: none; transition: border-color 0.15s; resize: none; }
  .field-input::placeholder, .field-textarea::placeholder { color: rgba(238,224,196,0.25); }
  .field-input:focus, .field-textarea:focus { border-color: rgba(255,255,255,0.25); }
  .field-select option { background: var(--board-3); color: #EEE0C4; }
  .field-textarea { line-height: 1.6; min-height: 120px; } .field-textarea.tall { min-height: 180px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* DROPZONE UI */
  .dropzone { border: 2px dashed var(--border-dark-2); border-radius: 8px; padding: 30px; text-align: center; color: rgba(244,239,228,0.6); font-size: 13px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02); }
  .dropzone:hover, .dropzone.dragover { border-color: var(--gold-3); background: rgba(240,192,64,0.05); color: var(--gold-3); }

  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark-2); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px; }
  .card.gold-border { border-color: rgba(176,123,8,0.4); background: rgba(176,123,8,0.07); }
  .card.green-border { border-color: rgba(82,196,122,0.3); background: rgba(82,196,122,0.06); }
  .card.red-border { border-color: rgba(196,74,28,0.4); background: rgba(196,74,28,0.07); }

  .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #EEE0C4; border: 1px solid var(--border-dark-2); border-radius: 8px; padding: 10px 18px; font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; transition: all 0.14s; }
  .btn-secondary:hover { background: rgba(255,255,255,0.13); }
  .btn-pdf { background: var(--gold-2); color: #000; border: none; border-radius: 8px; padding: 10px 18px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-pdf:hover { background: var(--gold-3); }
  .btn-fix { background: rgba(196,74,28,0.15); color: #F0A870; border: 1px solid rgba(196,74,28,0.4); border-radius: 6px; padding: 5px 10px; font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.1s; display: inline-block; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: bold; }
  .btn-fix:hover { background: rgba(196,74,28,0.3); color: #fff; }

  .dual-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .lane { background: rgba(255,255,255,0.04); border: 1px solid var(--border-dark); border-radius: 9px; padding: 12px 13px; }
  .lane.const-lane { border-color: rgba(176,123,8,0.35); background: rgba(176,123,8,0.06); }
  .lane-header { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,239,228,0.4); margin-bottom: 7px; }
  .lane.const-lane .lane-header { color: var(--gold-3); }

  /* Output Editor */
  .output-box { background: rgba(255,255,255,0.04); border: 1px solid var(--border-dark-2); border-radius: var(--radius-lg); padding: 18px; min-height: 100px; font-family: 'Lora', serif; font-size: 13px; line-height: 1.75; color: #EDE0C4; white-space: pre-wrap; position: relative; transition: all 0.3s; }
  .output-box[contenteditable="true"] { outline: none; border-color: var(--gold-3); background: rgba(240,192,64,0.03); cursor: text; }
  .output-box[contenteditable="true"]:focus { box-shadow: 0 0 0 2px rgba(240,192,64,0.2); }
  .edit-badge { position: absolute; top: -10px; right: 20px; background: var(--gold-3); color: #000; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; opacity: 0; transition: opacity 0.3s; font-family: 'DM Mono', monospace; }
  .output-box[contenteditable="true"] + .edit-badge { opacity: 1; }

  .score-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  .score-tile { background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark); border-radius: 9px; padding: 12px 14px; transition: all 0.3s;}
  .score-tile.gold { border-color: rgba(176,123,8,0.4); background: rgba(176,123,8,0.08); }
  .score-tile.green { border-color: rgba(82,196,122,0.3); background: rgba(82,196,122,0.07); }
  .score-tile.red { border-color: rgba(196,74,28,0.35); background: rgba(196,74,28,0.07); }
  .tile-label { font-size: 10px; color: rgba(244,239,228,0.38); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 5px; }
  .tile-val { font-family: 'DM Serif Display', serif; font-size: 28px; color: #F2E6CC; transition: color 0.3s;}
  .tile-val.green { color: var(--green-3); } .tile-val.gold { color: var(--gold-3); } .tile-val.red { color: var(--accent-3); }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; background: var(--green-3); }

  .clause-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px;}
  .clause-item { display: flex; justify-content: space-between; align-items: center; background: rgba(196,74,28,0.05); border: 1px solid rgba(196,74,28,0.2); border-radius: 6px; padding: 10px 14px; animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .article-list { display: flex; flex-direction: column; gap: 8px; }
  .article-item { background: rgba(176,123,8,0.08); border: 1px solid rgba(176,123,8,0.3); border-radius: 8px; padding: 12px 14px; }
  .article-num { font-size: 11px; color: var(--gold-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
  .article-title { font-size: 13px; color: #F2E6CC; font-weight: 500; margin-bottom: 4px; }
  .article-desc { font-size: 11px; color: rgba(244,239,228,0.5); font-style: italic; font-family: 'Lora', serif; line-height: 1.5; }

  .cursor { display: inline-block; width: 2px; height: 14px; background: var(--accent-3); margin-left: 2px; animation: blink 0.8s steps(1) infinite; vertical-align: text-bottom; }
  @keyframes blink { 50%{opacity:0} }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert { padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 8px; }
  .alert.info { background: rgba(82,196,122,0.12); border: 1px solid rgba(82,196,122,0.25); color: #90E8B8; }
  .alert.gold { background: rgba(176,123,8,0.12); border: 1px solid rgba(176,123,8,0.3); color: var(--gold-3); }

  .db-item { background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark); border-radius: 8px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
  .db-item:hover { border-color: var(--border); background: rgba(255,255,255,0.08); transform: translateY(-1px); }
  .db-item::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold-3); opacity:0; transition:0.2s;}
  .db-item:hover::before { opacity:1; }
  .db-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .db-title { font-size: 14px; font-weight: 600; color: #F2E6CC; }
  .db-date { font-size: 10px; color: var(--text-faint); }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-family: 'DM Mono', monospace; display:inline-block; margin-right:5px;}
  .tag-s { background: rgba(82,196,122,0.18); color: #90E8B8; } .tag-p { background: rgba(196,74,28,0.22); color: #F0A870; }

  /* Info Grid */
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .info-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border-dark); border-radius: 8px; padding: 12px; }
  .info-box-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.05em; }
  .info-box-val { font-size: 13px; color: #E8D5B8; font-weight: 500; }

  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<div class="shell">
<div class="window">

  <div class="titlebar">
    <div class="tl-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
    <div class="tl-title" id="titleText">vakeel.ai — universal legal intelligence</div>
    <div class="tl-badge">v2.5 pro</div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <div class="logo"><div class="logo-icon">⚖</div>Vakeel<div class="logo-dot"></div></div>
      
      <button class="db-btn" onclick="openDatabase()">📂 Case Files & History</button>

      <div>
        <div class="sb-label">Open Source Model</div>
        <div class="api-key-box select-wrapper">
          <select class="custom-select" id="aiModelSelect">
            <option value="Zephyr 7B Beta">Zephyr 7B Beta (free)</option>
            <option value="Mistral 7B Instruct">Mistral 7B Instruct (free)</option>
            <option value="Phi-3 Mini">Phi-3 Mini (free)</option>
            <option value="Falcon 7B">Falcon 7B (free)</option>
          </select>
        </div>
      </div>

      <div>
        <div class="sb-label">Mode</div>
        <div class="mode-toggle">
          <button class="mode-btn active" id="modeB2C" onclick="setMode('b2c')">👤 Citizen</button>
          <button class="mode-btn" id="modeB2B" onclick="setMode('b2b')">🏛 Lawyer</button>
        </div>
      </div>

      <div>
        <div class="sb-label">Workflow Steps</div>
        <div class="nav-list" id="navList"></div>
      </div>

      <div class="stat-card" id="scoreCard" style="display:none">
        <div><div class="stat-label">Draft Score</div><div style="font-size:10px;color:var(--text-faint);margin-top:2px;">latest run</div></div>
        <div class="stat-val" id="sidebarScore">—</div>
      </div>

      <div class="sb-footer">
        <button class="sb-btn primary" onclick="startNewRun()">+ New Case</button>
      </div>
    </div>

    <div class="main">
      <div class="grain"></div>
      <div class="topbar">
        <div class="status-pill"><div class="status-led"></div><span id="topbarStatus">Ready to assist</span></div>
        <div class="rag-pill">⚡ Dual-Vector RAG Active</div>
      </div>
      <div class="scroll-area" id="scrollArea">
        </div>
    </div>
  </div>
</div>
</div>

<script>
// ────────────────────────────────────────────────
// STATE & DATABASE
// ────────────────────────────────────────────────
let appState = { 
  mode: 'b2c', 
  step: 'input', 
  lastScore: 0,
  maxStepReached: 0,
  missingClauses: [],
  currentDraft: "",
  data: {},        // Stores Sender, Respondent, Facts, etc.
  constRights: []  // Stores matched Constitutional Rights
};

// Database Schema includes: caseDetails (appState.data), constRights, content, score
function getDB() { return JSON.parse(localStorage.getItem('vakeel_db')) || []; }
function saveToDB(title, content, type, score, caseDetails, constRights) {
  let db = getDB();
  db.unshift({ 
    id: Date.now(), 
    date: new Date().toLocaleString(), 
    title, 
    content, 
    type, 
    score, 
    caseDetails, 
    constRights 
  });
  localStorage.setItem('vakeel_db', JSON.stringify(db));
}

// Constitutional Mapping Logic
function getConstRights(category) {
   const map = {
     consumer: [
       {num:'Article 21', title:'Right to Life & Personal Liberty', desc:'Includes protection from exploitation and right to healthy environment.'}, 
       {num:'Article 14', title:'Right to Equality', desc:'No arbitrary discrimination or unfair trade practices by entities.'}
     ],
     employment: [
       {num:'Article 21', title:'Right to Livelihood', desc:'The Supreme Court has held that right to livelihood is integral to right to life.'}, 
       {num:'Article 16', title:'Equality of Opportunity', desc:'Protects against arbitrary employment practices in public sectors.'}
     ],
     property: [
       {num:'Article 300A', title:'Right to Property', desc:'No person shall be deprived of his property save by authority of law.'}
     ],
     writ: [
       {num:'Article 32 / 226', title:'Right to Constitutional Remedies', desc:'You have the right to approach the Supreme Court or High Court directly.'}, 
       {num:'Article 14', title:'Right to Equality', desc:'State action must be fair, just and not arbitrary.'}
     ],
     cheque: [
       {num:'Article 21', title:'Personal Liberty', desc:'Protection against arbitrary arrest in criminal proceedings related to financial fraud.'}
     ]
   };
   return map[category] || map['consumer'];
}

const FLOW_STEPS = [
  { id:'input', label:'Case Input', dot:'#888' },
  { id:'rag',   label:'Legal Reasoning', dot:'#52C47A' },
  { id:'draft', label:'Draft & Score', dot:'#C44A1C' },
  { id:'const', label:'Constitutional Strategy', dot:'#D4A017' }
];

// ────────────────────────────────────────────────
// INIT & NAVIGATION
// ────────────────────────────────────────────────
function init() { setMode('b2c'); }

function setMode(mode) {
  appState.mode = mode; 
  startNewRun();
}

function startNewRun() { 
  appState.step = 'input';
  appState.maxStepReached = 0;
  appState.lastScore = null; 
  appState.missingClauses = [];
  appState.data = {};
  appState.constRights = [];
  document.getElementById('modeB2C').classList.toggle('active', appState.mode === 'b2c');
  document.getElementById('modeB2B').classList.toggle('active', appState.mode === 'b2b');
  document.getElementById('scoreCard').style.display = 'none';
  document.getElementById('sidebarScore').textContent = '—'; 
  renderNav(); renderContent(); 
}

function renderNav() {
  document.getElementById('navList').innerHTML = FLOW_STEPS.map((s, index) => {
    let statusClass = '';
    if (appState.step === s.id) statusClass = 'active';
    else if (index <= appState.maxStepReached) statusClass = 'completed';
    
    return `
    <div class="nav-item ${statusClass}" ${index <= appState.maxStepReached ? `onclick="goStep('${s.id}')"` : ''}>
      <div class="nav-dot" style="background:${s.dot}"></div>${s.label}
    </div>`;
  }).join('');
}

function goStep(id) { 
  const targetIndex = FLOW_STEPS.findIndex(s => s.id === id);
  if (targetIndex <= appState.maxStepReached) {
    appState.step = id; 
    renderNav(); 
    renderContent(); 
  }
}

function renderContent() {
  const area = document.getElementById('scrollArea');
  const step = appState.step;
  if (step === 'input') renderInput(area);
  else if (step === 'rag') renderRag(area);
  else if (step === 'draft') renderDraft(area);
  else if (step === 'const') renderConst(area);
}

function toggleDropzone() {
  const dt = document.getElementById('docType');
  const ua = document.getElementById('uploadArea');
  const fl = document.getElementById('factsLabel');
  if(ua) {
    if (dt && dt.value === 'analyze_petition') {
      ua.style.display = 'block';
      fl.textContent = 'Extracted Petition Text (Editable)';
    } else {
      ua.style.display = 'none';
      fl.textContent = 'Facts & Background';
    }
  }
}

// Drag & Drop
function handleDragOver(e) { e.preventDefault(); document.getElementById('dropzone').classList.add('dragover'); }
function handleDragLeave(e) { e.preventDefault(); document.getElementById('dropzone').classList.remove('dragover'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) simulateExtraction(e.dataTransfer.files[0].name);
}
function handleFileUpload(e) {
  if (e.target.files && e.target.files[0]) simulateExtraction(e.target.files[0].name);
}
function simulateExtraction(filename) {
  const dt = document.getElementById('dropText');
  dt.innerHTML = `<div class="spinner" style="width:12px;height:12px;border-width:2px;border-top-color:var(--gold-3);margin-right:6px;"></div> Extracting...`;
  setTimeout(() => {
    document.getElementById('inpFacts').value = `[Extracted from: ${filename}]\n\nIN THE HON'BLE COURT...\n\nThe Petitioner humbly submits that the Respondent failed to fulfill obligations...`;
    dt.innerHTML = `<span style="color:var(--green-3);">✅ Extraction Complete!</span>`;
  }, 1200);
}

function runPipeline() {
  const facts = document.getElementById('inpFacts')?.value.trim();
  if (!facts) { alert('Please provide case facts or upload a draft.'); return; }
  
  appState.data = {
    model: document.getElementById('aiModelSelect').value,
    type: document.getElementById('docType').value,
    sender: document.getElementById('inpSender')?.value || 'Petitioner',
    respondent: document.getElementById('inpRespondent')?.value || 'Respondent',
    category: document.getElementById('inpCategory')?.value || 'consumer',
    facts: facts
  };
  
  appState.maxStepReached = 1;
  goStep('rag');
  setTimeout(() => { 
    appState.maxStepReached = 2;
    goStep('draft'); 
  }, 3000);
}

async function generateNewDraftAndScore(isAnalysis, d) {
  let baseScore = isAnalysis ? 74 : (d.type === 'notice' ? 92 : 88);
  
  // Set Constitutional Rights in state based on Category
  appState.constRights = getConstRights(d.category);

  if (isAnalysis || d.type === 'draft_petition') {
    appState.missingClauses = [
      { id: 'limitation', name: 'Limitation Clause', desc: 'Fails to explicitly state that the cause of action arose within the prescribed limitation period.', fixText: 'That the cause of action arose within the prescribed period of limitation, and the petition is not barred by time.' },
      { id: 'exhaustion', name: 'Alternative Remedy', desc: 'Writ petitions must state no other efficacious remedy exists.', fixText: 'That the Petitioner has exhausted all alternative and efficacious legal remedies available, and therefore approaches this Hon\'ble Court.' }
    ];
  } else {
    appState.missingClauses = [];
  }

  let mockText = isAnalysis 
    ? `[Analysis by ${d.model}]\n\nSTRENGTHS:\nThe factual matrix provided clearly establishes the grievance between ${d.sender} and ${d.respondent}.\n\nWEAKNESSES:\nYour draft is missing key procedural clauses required for admission.\n\nRECOMMENDATION:\nUse the Auto-Fix buttons above to insert the missing legal language, then review the final document.`
    : `IN THE HON'BLE COURT / FORUM\n\nIN THE MATTER OF:\n${d.sender} ... PETITIONER\nVERSUS\n${d.respondent} ... RESPONDENT\n\nPETITION UNDER THE RELEVANT STATUTES FOR ${d.category.toUpperCase()}\n\nMOST RESPECTFULLY SHOWETH:\n\n1. That the Petitioner is a law-abiding citizen and the Respondent is ${d.respondent}.\n\n2. BRIEF FACTS: ${d.facts}\n\n3. CAUSE OF ACTION: The cause of action arose when the Respondent committed the aforementioned acts.\n\n4. JURISDICTION: This Hon'ble Court has the territorial and pecuniary jurisdiction to try this matter.\n\nPRAYER:\nIn view of the above, it is most respectfully prayed that this Hon'ble Court may be pleased to:\na) Grant relief to the Petitioner as deemed fit.\n\nTHROUGH COUNSEL\nDate: ${new Date().toLocaleDateString()}`;

  if(d.type === 'notice') {
      mockText = `LEGAL NOTICE\nDate: ${new Date().toLocaleDateString()}\nTo, ${d.respondent}\nFrom, ${d.sender}\n\nSUBJECT: Legal Notice regarding ${d.category} violation.\n\nUnder instructions from my client, I serve you with the following notice:\n\n1. That the facts are: ${d.facts}\n2. You are called upon to rectify this and provide immediate relief within 15 days. Failing compliance, my client will initiate proceedings entirely at your risk and cost.\n\n[Signature]\nAdvocate for ${d.sender}`;
  }

  await mockStreamText(mockText, 'docOutput', 10);
  document.getElementById('docOutput').setAttribute("contenteditable", "true");
  
  appState.lastScore = baseScore;
  let v = 0;
  const iv = setInterval(() => {
    v += 2; if(v > baseScore) v = baseScore;
    document.getElementById('tileScore').textContent = v;
    document.getElementById('scoreBar').style.width = v + '%';
    if (v === baseScore) {
      clearInterval(iv);
      renderMissingClausesUI();
      // Auto-save generation WITH Case Details & Const Rights
      saveToDB(
        isAnalysis ? 'Analysis' : (d.type==='notice'?'Notice':'Petition'), 
        document.getElementById('docOutput').innerHTML, 
        d.type, 
        baseScore,
        appState.data,        // The input case details
        appState.constRights  // The identified rights
      );
    }
  }, 20);
}

function renderMissingClausesUI() {
  const missingCount = appState.missingClauses.length;
  const tileMissing = document.getElementById('tileMissing');
  tileMissing.textContent = missingCount;
  
  const redTile = tileMissing.parentElement;
  if(missingCount === 0) {
    redTile.className = "score-tile green";
    tileMissing.className = "tile-val green";
    document.getElementById('missingLabel').textContent = "All Clauses Present";
  }

  const container = document.getElementById('missingClausesContainer');
  if (missingCount > 0) {
    container.innerHTML = `
      <div style="font-size:10px; text-transform:uppercase; color:var(--accent-3); margin-top:10px; letter-spacing:0.1em;">Actionable Feedback</div>
      <div class="clause-list">
        ${appState.missingClauses.map(c => `
          <div class="clause-item" id="clause_${c.id}">
            <div>
              <div style="font-size:13px; font-weight:600; color:#F2E6CC;">⚠ ${c.name}</div>
              <div style="font-size:11px; color:rgba(244,239,228,0.5);">${c.desc}</div>
            </div>
            <button class="btn-fix" onclick="applyAutoFix('${c.id}')">+ Auto-Fix Draft</button>
          </div>
        `).join('')}
      </div>
    `;
  } else { container.innerHTML = ""; }
}

function applyAutoFix(id) {
  const clause = appState.missingClauses.find(c => c.id === id);
  if(!clause) return;

  const doc = document.getElementById('docOutput');
  const fixHtml = `<br><br><span style="color:var(--green-3);"><b>[AUTO-INSERTED: ${clause.name}]</b></span><br>${clause.fixText}`;
  doc.innerHTML += fixHtml;

  appState.missingClauses = appState.missingClauses.filter(c => c.id !== id);
  appState.lastScore += 10;
  if (appState.lastScore > 100) appState.lastScore = 100;
  
  document.getElementById('tileScore').textContent = appState.lastScore;
  document.getElementById('scoreBar').style.width = appState.lastScore + '%';
  
  renderMissingClausesUI();
  
  // Overwrite latest DB entry to save fix, preserving caseDetails and constRights
  let db = getDB();
  if(db.length > 0) {
    db[0].content = doc.innerHTML;
    db[0].score = appState.lastScore;
    localStorage.setItem('vakeel_db', JSON.stringify(db));
  }
}

function goToConst() {
  appState.maxStepReached = 3;
  goStep('const');
}

// ────────────────────────────────────────────────
function openDatabase() {
  document.getElementById('topbarStatus').textContent = '📂 Case Files & History Database';
  const area = document.getElementById('scrollArea');
  const db = getDB();

  let html = `
    <div class="sec-eyebrow">Local Storage</div>
    <div class="sec-title">Your Case Files</div>
    <div class="alert info">Click any case below to reload its details, drafts, and constitutional rights.</div>
  `;

  if (db.length === 0) {
    html += `<div style="color:var(--text-muted); font-size:12px;">No cases found. Run a pipeline to save data.</div>`;
  } else {
    html += db.map(item => `
      <div class="db-item" onclick="loadCase(${item.id})">
        <div class="db-header">
          <span class="db-title">${item.title}</span>
          <span class="db-date">${item.date}</span>
        </div>
        <div style="font-size:11px; color:#E8D5B8; margin-bottom:6px;">
          <strong>vs. ${item.caseDetails?.respondent || 'Unknown Respondent'}</strong>
        </div>
        <div style="font-size:12px; color:rgba(244,239,228,0.5); font-family:Lora,serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
           ${item.content.replace(/<[^>]*>?/gm, '').substring(0, 90)}...
        </div>
        <div style="margin-top:8px;">
          <span class="tag tag-s">Score: ${item.score}/100</span>
          <span class="tag tag-p">Type: ${item.type}</span>
          <span class="tag tag-c">${item.constRights?.length || 0} Rights Found</span>
        </div>
      </div>
    `).join('');
  }
  area.innerHTML = html;
}

function loadCase(id) {
  const db = getDB();
  const item = db.find(x => x.id === id);
  if(!item) return;

  if (item.type === 'analyze_petition' || item.type === 'draft_petition') {
    appState.mode = 'b2b';
  } else {
    appState.mode = 'b2c';
  }
  
  document.getElementById('modeB2C').classList.toggle('active', appState.mode === 'b2c');
  document.getElementById('modeB2B').classList.toggle('active', appState.mode === 'b2b');

  // Push ALL saved data back into state
  appState.data = item.caseDetails || { type: item.type, model: 'Loaded from Database' };
  appState.constRights = item.constRights || [];
  appState.currentDraft = item.content;
  appState.lastScore = item.score;
  appState.missingClauses = []; 
  appState.loadedFromDB = true;
  appState.maxStepReached = 3; 
  
  // Jump to draft step
  goStep('draft');
}

// PDF EXPORT

function generatePDF() {
  const element = document.getElementById('pdfTarget');
  const editableBox = document.getElementById('docOutput');
  
  appState.currentDraft = editableBox.innerHTML;
  
  const clone = element.cloneNode(true);
  clone.style.background = "#ffffff";
  clone.style.color = "#000000";
  clone.style.padding = "40px";
  clone.style.fontFamily = "serif";
  clone.style.fontSize = "14px";
  clone.style.lineHeight = "1.8";
  
  const badge = clone.querySelector('.edit-badge');
  if(badge) badge.remove();
  
  const box = clone.querySelector('.output-box');
  if(box) {
     box.style.border = "none";
     box.style.background = "transparent";
     box.style.color = "#000000";
  }

  const tempDiv = document.createElement('div');
  tempDiv.appendChild(clone);
  document.body.appendChild(tempDiv);
  tempDiv.style.position = "absolute";
  tempDiv.style.left = "-9999px";

  const opt = {
    margin:       0.5,
    filename:     `Vakeel_Draft_${Date.now()}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(clone).save().then(() => {
    document.body.removeChild(tempDiv);
  });
}

// ────────────────────────────────────────────────
// MOCK STREAMING HELPER
// ────────────────────────────────────────────────
async function mockStreamText(text, elementId, speedMs = 15) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.innerHTML = '<span class="cursor"></span>';
  let currentText = '';
  const tokens = text.split(' ');

  for (let i = 0; i < tokens.length; i++) {
    currentText += tokens[i] + ' ';
    el.innerHTML = escapeHtml(currentText).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
    await new Promise(r => setTimeout(r, speedMs)); 
  }
  el.innerHTML = escapeHtml(currentText).replace(/\n/g, '<br>');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
