<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vakeel.ai — Constitutional Legal Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F4EFE4;
    --cream-dark: #E8DFC9;
    --cream-mid: #EDE5D0;
    --board: #1E1208;
    --board-2: #2A1A0A;
    --board-3: #3A220E;
    --wood: #5C3318;
    --accent: #922E0E;
    --accent-2: #C44A1C;
    --accent-3: #E8693A;
    --gold: #B07B08;
    --gold-2: #D4A017;
    --gold-3: #F0C040;
    --green: #1A5C3A;
    --green-2: #2E8B57;
    --green-3: #52C47A;
    --text-dark: #140C04;
    --text-mid: #3D2210;
    --text-muted: #7A5A36;
    --text-faint: #B09070;
    --border: #C8B090;
    --border-dark: rgba(255,255,255,0.08);
    --border-dark-2: rgba(255,255,255,0.13);
    --sidebar: 240px;
    --radius: 10px;
    --radius-lg: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--cream-dark);
    font-family: 'DM Mono', monospace;
    color: var(--text-dark);
    overflow: hidden;
  }

  /* ── OUTER SHELL ── */
  .shell {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--cream-dark);
    background-image: radial-gradient(var(--border) 0.8px, transparent 0.8px);
    background-size: 22px 22px;
  }

  /* ── WINDOW CHROME ── */
  .window {
    margin: 18px auto;
    width: calc(100% - 36px);
    max-width: 1280px;
    height: calc(100vh - 36px);
    background: var(--cream);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    box-shadow: 0 8px 40px rgba(20,12,4,0.28), 0 2px 8px rgba(20,12,4,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .titlebar {
    background: var(--cream-mid);
    border-bottom: 1.5px solid var(--border);
    padding: 10px 18px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }

  .tl-dots { display: flex; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #FF5F57; }
  .dot-y { background: #FEBC2E; }
  .dot-g { background: #28C840; }

  .tl-title {
    flex: 1; text-align: center;
    font-size: 12px; color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .tl-badge {
    font-size: 10px; color: var(--text-muted);
    background: var(--cream); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 8px;
  }

  /* ── BODY LAYOUT ── */
  .app-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar);
    background: var(--cream);
    border-right: 1.5px solid var(--border);
    display: flex; flex-direction: column;
    padding: 18px 14px 16px;
    gap: 20px;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .logo {
    display: flex; align-items: center; gap: 9px;
    font-family: 'DM Serif Display', serif;
    font-size: 24px; color: var(--text-dark);
  }
  .logo-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--board); display: flex;
    align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .logo-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2); margin-bottom: 14px; margin-left: -4px;
  }

  .sb-label {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 6px;
  }

  .mode-toggle {
    display: flex; background: var(--cream-dark);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .mode-btn {
    flex: 1; padding: 8px 4px; border: none; background: transparent;
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .mode-btn.active {
    background: var(--board); color: var(--cream);
    border-radius: 6px; margin: 2px;
  }

  .nav-list { display: flex; flex-direction: column; gap: 3px; }
  .nav-item {
    padding: 9px 11px; border-radius: 7px; border: 1px solid transparent;
    font-size: 11px; color: var(--text-mid); cursor: pointer;
    display: flex; align-items: center; gap: 9px; transition: all 0.14s;
    background: transparent;
  }
  .nav-item:hover { background: var(--cream-dark); border-color: var(--border); }
  .nav-item.active { background: var(--board); color: var(--cream); border-color: var(--board-3); }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .api-key-box {
    background: var(--cream-dark); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 11px;
  }
  .api-key-box input {
    width: 100%; background: transparent; border: none; outline: none;
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--text-mid); letter-spacing: 0.04em;
  }
  .api-key-box input::placeholder { color: var(--text-faint); }

  .stat-card {
    background: var(--cream-dark); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .stat-label { font-size: 10px; color: var(--text-muted); }
  .stat-val {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: var(--accent);
  }

  .sb-footer { margin-top: auto; display: flex; gap: 6px; }
  .sb-btn {
    flex: 1; padding: 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--cream-dark);
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-mid);
    cursor: pointer; transition: all 0.12s;
  }
  .sb-btn:hover { background: var(--cream-mid); }
  .sb-btn.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .sb-btn.primary:hover { background: var(--accent-2); }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1; background: var(--board);
    display: flex; flex-direction: column; min-width: 0; position: relative;
    overflow: hidden;
  }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px; border-bottom: 1px solid var(--border-dark);
    flex-shrink: 0; position: relative; z-index: 2;
  }
  .status-pill {
    background: rgba(255,255,255,0.07); border: 1px solid var(--border-dark-2);
    border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #E8D5B8;
    display: flex; align-items: center; gap: 7px;
  }
  .status-led { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--green-3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .rag-pill {
    background: var(--green); border-radius: 20px; padding: 5px 13px;
    font-size: 11px; color: #90E8B8; display: flex; align-items: center; gap: 5px;
  }

  /* ── SCROLL AREA ── */
  .scroll-area {
    flex: 1; overflow-y: auto; padding: 22px 22px 32px;
    position: relative; z-index: 1;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent;
  }

  /* ── SECTION HEADER ── */
  .sec-eyebrow {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(244,239,228,0.3); margin-bottom: 5px;
  }
  .sec-title {
    font-family: 'Lora', serif; font-size: 20px; font-weight: 600;
    color: #F2E6CC; margin-bottom: 18px;
  }

  /* ── FORM FIELDS ── */
  .field-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .field-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(244,239,228,0.45); margin-bottom: 5px;
  }
  .field-input, .field-textarea, .field-select {
    width: 100%; background: rgba(255,255,255,0.055);
    border: 1px solid var(--border-dark-2); border-radius: 8px;
    padding: 11px 13px; font-family: 'DM Mono', monospace; font-size: 12px;
    color: #EEE0C4; outline: none; transition: border-color 0.15s;
    resize: none;
  }
  .field-input::placeholder, .field-textarea::placeholder { color: rgba(238,224,196,0.25); }
  .field-input:focus, .field-textarea:focus { border-color: rgba(255,255,255,0.25); }
  .field-select option { background: var(--board-3); color: #EEE0C4; }
  .field-textarea { line-height: 1.6; min-height: 120px; }
  .field-textarea.tall { min-height: 180px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .field-row { grid-template-columns: 1fr; } }

  /* ── CARDS ── */
  .card {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark-2);
    border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px;
  }
  .card.gold-border { border-color: rgba(176,123,8,0.4); background: rgba(176,123,8,0.07); }
  .card.green-border { border-color: rgba(82,196,122,0.3); background: rgba(82,196,122,0.06); }
  .card.red-border { border-color: rgba(196,74,28,0.4); background: rgba(196,74,28,0.07); }

  /* ── BUTTONS ── */
  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 12px 24px;
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: rgba(255,255,255,0.08); color: #EEE0C4;
    border: 1px solid var(--border-dark-2);
    border-radius: 8px; padding: 10px 18px;
    font-family: 'DM Mono', monospace; font-size: 12px;
    cursor: pointer; transition: all 0.14s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.13); }

  /* ── DUAL SEARCH LANES ── */
  .dual-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .lane {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-dark);
    border-radius: 9px; padding: 12px 13px;
  }
  .lane.const-lane { border-color: rgba(176,123,8,0.35); background: rgba(176,123,8,0.06); }
  .lane-header { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,239,228,0.4); margin-bottom: 7px; }
  .lane.const-lane .lane-header { color: var(--gold-3); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    font-family: 'DM Mono', monospace;
  }
  .tag-s { background: rgba(82,196,122,0.18); color: #90E8B8; }
  .tag-c { background: rgba(240,192,64,0.18); color: var(--gold-3); }
  .tag-p { background: rgba(196,74,28,0.22); color: #F0A870; }

  /* ── OUTPUT AREA ── */
  .output-box {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-dark-2);
    border-radius: var(--radius-lg); padding: 18px; min-height: 100px;
    font-family: 'Lora', serif; font-size: 13px; line-height: 1.75;
    color: #EDE0C4; white-space: pre-wrap; position: relative;
  }
  .output-box.loading { opacity: 0.6; }
  .output-placeholder { color: rgba(237,224,196,0.28); font-style: italic; font-size: 12px; }

  /* ── SCORE DASHBOARD ── */
  .score-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 800px) { .score-grid { grid-template-columns: repeat(2,1fr); } }
  .score-tile {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark);
    border-radius: 9px; padding: 12px 14px;
  }
  .score-tile.gold { border-color: rgba(176,123,8,0.4); background: rgba(176,123,8,0.08); }
  .score-tile.green { border-color: rgba(82,196,122,0.3); background: rgba(82,196,122,0.07); }
  .score-tile.red { border-color: rgba(196,74,28,0.35); background: rgba(196,74,28,0.07); }
  .tile-label { font-size: 10px; color: rgba(244,239,228,0.38); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 5px; }
  .tile-val { font-family: 'DM Serif Display', serif; font-size: 28px; color: #F2E6CC; }
  .tile-val.green { color: var(--green-3); }
  .tile-val.gold { color: var(--gold-3); }
  .tile-val.red { color: var(--accent-3); }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 1s ease; background: var(--green-3); }
  .progress-fill.gold { background: var(--gold-3); }

  /* ── TABS ── */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-btn {
    padding: 7px 14px; border-radius: 7px; border: 1px solid transparent;
    background: transparent; font-family: 'DM Mono', monospace; font-size: 11px;
    color: rgba(244,239,228,0.5); cursor: pointer; transition: all 0.13s;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.07); color: rgba(244,239,228,0.8); }
  .tab-btn.active { background: rgba(255,255,255,0.1); border-color: var(--border-dark-2); color: #F2E6CC; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── PRECEDENT LIST ── */
  .precedent-list { display: flex; flex-direction: column; gap: 8px; }
  .precedent-item {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-dark);
    border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: all 0.13s;
  }
  .precedent-item:hover { background: rgba(255,255,255,0.08); }
  .precedent-name { font-size: 13px; color: #F0E4CC; font-weight: 500; margin-bottom: 3px; }
  .precedent-meta { font-size: 11px; color: rgba(244,239,228,0.4); display: flex; gap: 10px; }
  .precedent-relevance {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    background: rgba(82,196,122,0.18); color: var(--green-3);
    float: right; margin-top: -20px;
  }

  /* ── CONSTITUTIONAL ARTICLES ── */
  .article-list { display: flex; flex-direction: column; gap: 8px; }
  .article-item {
    background: rgba(176,123,8,0.08); border: 1px solid rgba(176,123,8,0.3);
    border-radius: 8px; padding: 12px 14px;
  }
  .article-num { font-size: 11px; color: var(--gold-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
  .article-title { font-size: 13px; color: #F2E6CC; font-weight: 500; margin-bottom: 4px; }
  .article-desc { font-size: 11px; color: rgba(244,239,228,0.5); font-style: italic; font-family: 'Lora', serif; line-height: 1.5; }

  /* ── STREAMING CURSOR ── */
  .cursor { display: inline-block; width: 2px; height: 14px; background: var(--accent-3); margin-left: 2px; animation: blink 0.8s steps(1) infinite; vertical-align: text-bottom; }
  @keyframes blink { 50%{opacity:0} }

  /* ── LOADING SPINNER ── */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ALERT ── */
  .alert {
    padding: 10px 14px; border-radius: 8px; font-size: 12px;
    margin-bottom: 12px; display: flex; align-items: flex-start; gap: 8px;
  }
  .alert.warn { background: rgba(196,74,28,0.15); border: 1px solid rgba(196,74,28,0.3); color: #F0A870; }
  .alert.info { background: rgba(82,196,122,0.12); border: 1px solid rgba(82,196,122,0.25); color: #90E8B8; }
  .alert.gold { background: rgba(176,123,8,0.12); border: 1px solid rgba(176,123,8,0.3); color: var(--gold-3); }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--border-dark); margin: 18px 0; }

  /* ── ACTION ROW ── */
  .action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ── NOTICE PREVIEW ── */
  .notice-header {
    font-size: 11px; letter-spacing: 0.06em; color: rgba(244,239,228,0.35);
    text-transform: uppercase; border-bottom: 1px solid var(--border-dark); padding-bottom: 10px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="shell">
<div class="window">

  <!-- TITLEBAR -->
  <div class="titlebar">
    <div class="tl-dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="tl-title" id="titleText">vakeel.ai — constitutional legal intelligence</div>
    <div class="tl-badge">v1.0 mvp</div>
  </div>

  <div class="app-body">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">⚖</div>
        Vakeel
        <div class="logo-dot"></div>
      </div>

      <!-- API KEY -->
      <div>
        <div class="sb-label">Anthropic API Key</div>
        <div class="api-key-box">
          <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off">
        </div>
      </div>

      <!-- MODE -->
      <div>
        <div class="sb-label">Mode</div>
        <div class="mode-toggle">
          <button class="mode-btn active" id="modeB2C" onclick="setMode('b2c')">👤 Citizen</button>
          <button class="mode-btn" id="modeB2B" onclick="setMode('b2b')">🏛 Lawyer</button>
        </div>
      </div>

      <!-- NAV -->
      <div>
        <div class="sb-label">Workflow</div>
        <div class="nav-list" id="navList"></div>
      </div>

      <!-- SCORE STAT -->
      <div class="stat-card" id="scoreCard" style="display:none">
        <div>
          <div class="stat-label">Draft Score</div>
          <div style="font-size:10px;color:var(--text-faint);margin-top:2px;">last analysis</div>
        </div>
        <div class="stat-val" id="sidebarScore">—</div>
      </div>

      <div class="sb-footer">
        <button class="sb-btn" onclick="resetApp()">Reset</button>
        <button class="sb-btn primary" onclick="startNewRun()">New Run</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="grain"></div>

      <div class="topbar">
        <div class="status-pill">
          <div class="status-led"></div>
          <span id="topbarStatus">Select a mode and enter your case details</span>
        </div>
        <div class="rag-pill">⚡ RAG · dual-vector</div>
      </div>

      <div class="scroll-area" id="scrollArea">
        <!-- Dynamic content rendered here -->
      </div>
    </div>
  </div>
</div>
</div>

<script>
// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let appState = {
  mode: 'b2c',
  step: 'input',
  apiKey: '',
  lastScore: null,
  runCount: 0
};

const B2C_STEPS = [
  { id:'input', label:'Case Facts', dot:'#888' },
  { id:'rag',   label:'RAG Search', dot:'#52C47A' },
  { id:'notice',label:'Notice Draft', dot:'#C44A1C' },
  { id:'rights',label:'Constitutional Rights', dot:'#D4A017' }
];
const B2B_STEPS = [
  { id:'upload', label:'Upload Petition', dot:'#888' },
  { id:'search', label:'Precedent Search', dot:'#52C47A' },
  { id:'score',  label:'Draft Score', dot:'#C44A1C' },
  { id:'const',  label:'Constitutional Backing', dot:'#D4A017' }
];

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  renderNav();
  renderContent();
}

function setMode(mode) {
  appState.mode = mode;
  appState.step = mode === 'b2c' ? 'input' : 'upload';
  document.getElementById('modeB2C').classList.toggle('active', mode === 'b2c');
  document.getElementById('modeB2B').classList.toggle('active', mode === 'b2b');

async function streamB2CNotice() {
  const key = appState.b2cData.key;
  const outputEl = document.getElementById('noticeOutput');
  if (!outputEl) return;
  outputEl.innerHTML = '<span class="cursor"></span>';
  let fullText = '';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        stream: true,
        messages: [{ role: 'user', content: appState.b2cPrompt }]
      })
    });
    if (!resp.ok) { throw new Error(await resp.text()); }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value);
      const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
      for (const line of lines) {
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            fullText += parsed.delta.text;
            const el = document.getElementById('noticeOutput');
            if (el) el.innerHTML = escapeHtml(fullText) + '<span class="cursor"></span>';
          }
        } catch {}
      }
    }
    appState.noticeText = fullText;
    const el = document.getElementById('noticeOutput');
    if (el) el.innerHTML = escapeHtml(fullText);
    document.getElementById('topbarStatus').textContent = 'Step 3 — Notice generated ✓';
  } catch(e) {
    const el = document.getElementById('noticeOutput');
    if (el) el.innerHTML = `<span style="color:#F0A870;">Error: ${e.message}</span>`;
  }
}

    {"name": "<case name>", "citation": "<AIR/SCC citation>", "court": "<court>", "year": <year>, "relevance": "<why relevant>", "strength": <integer 60-99>},
    ...
  ]
}
Provide exactly 4-6 precedents and 3-5 missing clauses. Be realistic and cite real Indian landmark cases where applicable.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': d.key, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 2000, messages: [{ role:'user', content: prompt }] })
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text || '{}';
    let parsed;
    try { parsed = JSON.parse(text.replace(/```json|```/g,'')); }
    catch { parsed = { score: 72, missing_count: 3, precedent_count: 5, article_count: 4, analysis: text, missing_clauses: [], precedents: [] }; }

    // Animate score
    const score = Math.min(100, Math.max(0, parseInt(parsed.score) || 70));
    appState.lastScore = score;
    appState.b2bResult = parsed;
    document.getElementById('sidebarScore').textContent = score;
    document.getElementById('scoreCard').style.display = 'flex';
    let v = 0;
    const iv = setInterval(() => {
      v = Math.min(v + 2, score);
      const el = document.getElementById('tileScore');
      if (el) el.textContent = v;
      const bar = document.getElementById('scoreBar');
      if (bar) bar.style.width = v + '%';
      if (v >= score) clearInterval(iv);
    }, 20);
    const el = (id) => document.getElementById(id);
    if (el('tileMissing')) el('tileMissing').textContent = parsed.missing_count ?? parsed.missing_clauses?.length ?? '—';
    if (el('tilePrecedents')) el('tilePrecedents').textContent = parsed.precedent_count ?? parsed.precedents?.length ?? '—';
    if (el('tileArticles')) el('tileArticles').textContent = parsed.article_count ?? 4;

    // Analysis tab
    if (el('analysisOutput')) el('analysisOutput').innerHTML = escapeHtml(parsed.analysis || 'Analysis complete.');

    // Precedents
    if (el('precedentList') && parsed.precedents?.length) {
      el('precedentList').innerHTML = parsed.precedents.map(p => `
        <div class="precedent-item">
          <div class="precedent-relevance">${p.strength || 85}% match</div>
          <div class="precedent-name">${escapeHtml(p.name)}</div>
          <div class="precedent-meta">
            <span>${escapeHtml(p.citation || '')}</span>
            <span>${p.court || ''} · ${p.year || ''}</span>
          </div>
          <div style="font-size:11px;color:rgba(244,239,228,0.45);margin-top:5px;font-style:italic;font-family:Lora,serif;">${escapeHtml(p.relevance || '')}</div>
        </div>`).join('');
    } else if (el('precedentList')) {
      el('precedentList').innerHTML = '<div style="color:rgba(244,239,228,0.4);font-size:12px;padding:12px;">No precedents extracted.</div>';
    }

    // Missing clauses
    if (el('clauseList') && parsed.missing_clauses?.length) {
      el('clauseList').innerHTML = parsed.missing_clauses.map(c => `
        <div class="card red-border" style="margin-bottom:8px;">
          <div style="font-size:13px;color:#F0A870;font-weight:500;margin-bottom:4px;">⚠ ${escapeHtml(c.clause)}</div>
          <div style="font-size:12px;color:rgba(244,239,228,0.55);font-style:italic;font-family:Lora,serif;">${escapeHtml(c.reason)}</div>
        </div>`).join('');
    } else if (el('clauseList')) {
      el('clauseList').innerHTML = '<div style="color:rgba(244,239,228,0.4);font-size:12px;padding:12px;">No missing clauses identified.</div>';
    }

    document.getElementById('topbarStatus').textContent = `Step 3 — Analysis complete · Score: ${score}/100`;
  } catch(e) {
    const el = document.getElementById('analysisOutput');
    if (el) el.innerHTML = `<span style="color:#F0A870;">Error: ${e.message}</span>`;
  }
}

async function runB2BConst() {

  const prompt = `You are Vakeel AI. Based on this petition, provide constitutional analysis.

PETITION SUMMARY: ${d.petition?.slice(0, 500)}
Case type: ${d.caseType} | Forum: ${d.forum}
${appState.b2bResult ? `Existing analysis: ${appState.b2bResult.analysis?.slice(0,300)}` : ''}

Provide constitutional backing in this JSON (respond with JSON only):
{
  "articles": [
    {"num": "Article X", "title": "<right name>", "applicability": "<why it applies to this petition>", "landmark_case": "<real landmark case name>"},
    ...
  ],
  "writs": [
    {"type": "<Habeas Corpus/Mandamus/Certiorari/Prohibition/Quo Warranto>", "applicability": "<why this writ fits>", "when_to_use": "<specific trigger>"},
    ...
  ],
  "strategy_note": "<1-2 sentence overall constitutional strategy recommendation>"
}
Provide 3-5 articles and 1-3 writs relevant to the case type.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':d.key,'anthropic-version':'2023-06-01'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1500, messages:[{role:'user',content:prompt}] })
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text || '{}';
    let parsed;
    try { parsed = JSON.parse(text.replace(/```json|```/g,'')); }
    catch { parsed = { articles:[], writs:[], strategy_note: text.slice(0,200) }; }

    const out = document.getElementById('constOutput');
    if (!out) return;
    let html = '';
    if (parsed.strategy_note) {
      html += `<div class="card gold-border" style="margin-bottom:16px;">
        <div style="font-size:10px;color:var(--gold-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">Strategic Recommendation</div>
        <div style="font-size:13px;color:#F2E6CC;font-family:Lora,serif;font-style:italic;line-height:1.6;">${escapeHtml(parsed.strategy_note)}</div>
      </div>`;
    }
    if (parsed.articles?.length) {
      html += `<div style="font-size:10px;color:rgba(244,239,228,0.35);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;">Constitutional Articles</div>
      <div class="article-list">`;
      html += parsed.articles.map(a => `
        <div class="article-item">
          <div class="article-num">${escapeHtml(a.num)}</div>
          <div class="article-title">${escapeHtml(a.title)}</div>
          <div class="article-desc">${escapeHtml(a.applicability)}</div>
          ${a.landmark_case ? `<div style="font-size:10px;color:rgba(240,192,64,0.55);margin-top:5px;">Landmark: ${escapeHtml(a.landmark_case)}</div>` : ''}
        </div>`).join('');
      html += `</div>`;
    }
    if (parsed.writs?.length) {
      html += `<div style="font-size:10px;color:rgba(244,239,228,0.35);text-transform:uppercase;letter-spacing:0.12em;margin:16px 0 10px;">Available Writs</div>`;
      html += parsed.writs.map(w => `
        <div class="card green-border" style="margin-bottom:8px;">
          <div style="font-size:13px;color:var(--green-3);font-weight:500;margin-bottom:4px;">Writ of ${escapeHtml(w.type)}</div>
          <div style="font-size:12px;color:rgba(244,239,228,0.6);margin-bottom:4px;">${escapeHtml(w.applicability)}</div>

        </div>`).join('');
    }
    out.innerHTML = html || '<div style="color:rgba(244,239,228,0.4);font-size:12px;">No constitutional data extracted.</div>';
  } catch(e) {
    const out = document.getElementById('constOutput');
    if (out) out.innerHTML = `<span style="color:#F0A870;">Error: ${e.message}</span>`;
  }

async function b2bConstAsk() {
  const key = appState.b2bData?.key;
  const q = document.getElementById('b2bConstQ')?.value.trim();
  if (!q || !key) return;
  const outDiv = document.getElementById('constFollowup');
  outDiv.innerHTML = `<div class="card" style="margin-top:12px;"><div class="output-box" id="constFollowupText"><span class="cursor"></span></div></div>`;
  const prompt = `You are Vakeel AI, a constitutional law expert. Answer this question for a lawyer:
Context: ${appState.b2bData?.petition?.slice(0,400) || ''}
Question: ${q}
Be precise, cite real Indian constitutional provisions, and give actionable advice in 150 words or less.`;
  await streamToElement('constFollowupText', key, prompt);
}

// ────────────────────────────────────────────────
// SHARED STREAMING HELPER
// ────────────────────────────────────────────────
async function streamToElement(elId, key, prompt) {
  const el = () => document.getElementById(elId);
  if (!el()) return;
  el().innerHTML = '<span class="cursor"></span>';
  let full = '';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:800, stream:true, messages:[{role:'user',content:prompt}] })
    });
    if (!resp.ok) throw new Error(await resp.text());
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = dec.decode(value).split('\n').filter(l=>l.startsWith('data: '));
      for (const line of lines) {
        try {
          const d = JSON.parse(line.slice(6));
          if (d.type === 'content_block_delta' && d.delta?.text) {
            full += d.delta.text;
            if (el()) el().innerHTML = escapeHtml(full) + '<span class="cursor"></span>';
          }
        } catch {}
      }
    }
    if (el()) el().innerHTML = escapeHtml(full);
  } catch(e) {
    if (el()) el().innerHTML = `<span style="color:#F0A870;">Error: ${e.message}</span>`;
  }
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyNotice() {
  const text = appState.noticeText || document.getElementById('noticeOutput')?.innerText || '';
  navigator.clipboard.writeText(text).then(() => alert('Notice copied to clipboard!')).catch(() => {});
}
